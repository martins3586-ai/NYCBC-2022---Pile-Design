<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#efe4c9"/><circle cx="3" cy="4" r="1.3" fill="#cdb98c"/><circle cx="9" cy="9" r="1" fill="#cdb98c"/></pattern>
  </defs>
  <rect width="180" height="180" fill="#f6f7f4"/>
  <!-- soil -->
  <rect x="0" y="138" width="180" height="42" fill="url(#dots)"/>
  <line x1="0" y1="138" x2="180" y2="138" stroke="#1d2433" stroke-width="3"/>
  <!-- pile, partly driven -->
  <rect x="127" y="78" width="8" height="60" fill="#2f5aa8"/>
  <rect x="127" y="138" width="8" height="30" fill="#2f5aa8" fill-opacity="0.45"/>
  <!-- leads (mast) with lattice -->
  <g stroke="#1d2433" fill="none">
    <line x1="122" y1="14" x2="122" y2="134" stroke-width="3"/>
    <line x1="140" y1="14" x2="140" y2="134" stroke-width="3"/>
    <path d="M122 24 L140 36 L122 48 L140 60 L122 72 M122 98 L140 110 L122 122 L140 134" stroke-width="1.5"/>
  </g>
  <rect x="119" y="10" width="24" height="6" fill="#1d2433"/>
  <!-- hammer -->
  <rect x="120" y="50" width="22" height="26" rx="2" fill="#b23a2b"/>
  <rect x="124" y="76" width="14" height="4" fill="#1d2433"/>
  <!-- boom from body to top of leads, lattice -->
  <g stroke="#1d2433" fill="none" stroke-linecap="round">
    <line x1="58" y1="106" x2="121" y2="18" stroke-width="3"/>
    <line x1="68" y1="110" x2="122" y2="34" stroke-width="3"/>
    <path d="M58.0 106.0 L74.8 100.5 L73.8 84.0 L88.2 81.5 L89.5 62.0 L101.8 62.5 L105.2 40.0 L115.2 43.5 L121.0 18.0" stroke-width="1.4"/>
  </g>
  <!-- hoist line -->
  <line x1="131" y1="16" x2="131" y2="50" stroke="#1d2433" stroke-width="1.2"/>
  <!-- bottom brace from leads to machine -->
  <line x1="98" y1="126" x2="122" y2="126" stroke="#1d2433" stroke-width="3"/>
  <!-- machine body and cab -->
  <rect x="34" y="100" width="66" height="24" rx="3" fill="#2f5aa8"/>
  <rect x="22" y="104" width="14" height="18" fill="#1d2433"/>
  <path d="M70 100 V84 H90 L96 100 Z" fill="#2f5aa8"/>
  <path d="M74 98 V88 H88 L92 98 Z" fill="#e3eaf7"/>
  <!-- crawler tracks -->
  <rect x="24" y="124" width="82" height="14" rx="7" fill="#1d2433"/>
  <g fill="#8f887a"><circle cx="32" cy="131" r="4"/><circle cx="48" cy="131" r="3"/><circle cx="65" cy="131" r="3"/><circle cx="82" cy="131" r="3"/><circle cx="98" cy="131" r="4"/></g>
</svg>
