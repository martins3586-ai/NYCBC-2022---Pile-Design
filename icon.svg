<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#efe4c9"/><circle cx="3" cy="4" r="1.3" fill="#cdb98c"/><circle cx="9" cy="9" r="1" fill="#cdb98c"/></pattern>
    <pattern id="org" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#d9cdb0"/><path d="M0 10L10 0" stroke="#b3a782" stroke-width="1.2"/></pattern>
  </defs>
  <rect width="180" height="180" fill="#f6f7f4"/>
